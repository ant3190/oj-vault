name: Manage OJ accounts

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[OJ Vault]')
    runs-on: ubuntu-latest
    steps:
      - name: Apply account command
        uses: actions/github-script@v7
        with:
          script: |
            const marker = context.payload.issue.body.match(/<!-- OJ_VAULT_ACCOUNT (\{.*\}) -->/)
            if (!marker) core.setFailed('Missing OJ Vault account command')
            const command = JSON.parse(marker[1])
            const validPlatforms = ['luogu', 'codeforces', 'qoj', 'uoj', 'atcoder']
            if (command.action !== 'replace' || !Array.isArray(command.accounts) || command.accounts.length > 100) return core.setFailed('Invalid account command')
            const path = 'public/data/accounts.json'
            const file = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path })
            const seen = new Set()
            const accounts = []
            for (const item of command.accounts) {
              if (!validPlatforms.includes(item.platform) || typeof item.username !== 'string' || !item.username.trim()) return core.setFailed('Invalid account entry')
              const key = `${item.platform}:${item.username.trim().toLowerCase()}`
              if (seen.has(key)) continue
              seen.add(key)
              const safeName = item.username.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-|-$/g, '') || Date.now().toString()
              accounts.push({ id: `${item.platform}-${safeName}`, platform: item.platform, username: item.username.trim(), enabled: item.enabled !== false })
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              sha: file.data.sha,
              message: 'config: update OJ accounts',
              content: Buffer.from(`${JSON.stringify(accounts, null, 2)}\n`).toString('base64'),
            })
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: '账号配置已经更新，OJ Vault 将自动重新部署。' })
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' })
