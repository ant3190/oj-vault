name: Manage OJ accounts

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[OJ Vault]')
    runs-on: ubuntu-latest
    steps:
      - name: Apply account command
        uses: actions/github-script@v7
        with:
          script: |
            const marker = context.payload.issue.body.match(/<!-- OJ_VAULT_ACCOUNT (\{.*\}) -->/)
            if (!marker) core.setFailed('Missing OJ Vault account command')
            const command = JSON.parse(marker[1])
            const validPlatforms = ['luogu', 'codeforces', 'qoj', 'uoj', 'atcoder']
            const validActions = ['bind', 'remove', 'enable', 'disable']
            if (!validPlatforms.includes(command.platform) || !validActions.includes(command.action) || typeof command.username !== 'string') {
              core.setFailed('Invalid account command')
              return
            }
            const path = 'public/data/accounts.json'
            const file = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path })
            const accounts = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'))
            const same = account => account.platform === command.platform && account.username.toLowerCase() === command.username.trim().toLowerCase()
            const index = accounts.findIndex(same)
            if (command.action === 'bind' && index === -1) {
              const safeName = command.username.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-|-$/g, '') || Date.now().toString()
              accounts.push({ id: `${command.platform}-${safeName}`, platform: command.platform, username: command.username.trim(), enabled: true })
            } else if (command.action === 'remove' && index !== -1) {
              accounts.splice(index, 1)
            } else if ((command.action === 'enable' || command.action === 'disable') && index !== -1) {
              accounts[index].enabled = command.action === 'enable'
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              sha: file.data.sha,
              message: `config: ${command.action} ${command.platform} account`,
              content: Buffer.from(`${JSON.stringify(accounts, null, 2)}\n`).toString('base64'),
            })
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: '账号配置已经更新，OJ Vault 将自动重新部署。' })
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' })
