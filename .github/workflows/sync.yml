name: Sync OJ problems

on:
  schedule:
    # 00:00 UTC = 08:00 China Standard Time
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger OJ Vault sync service
        run: |
          curl --fail --silent --show-error \
            --max-time 300 \
            --retry 2 \
            https://oj-vault-sync.true-fir-4785.chatgpt.site/api/auto-sync \
            | jq -e '.ok == true' >/dev/null
