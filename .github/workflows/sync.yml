name: Sync OJ problems

on:
  push:
    branches: [main]
    paths:
      - public/data/accounts.json
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Save changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "oj-vault-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/problems.json
          git commit -m "data: sync accepted problems"
          git push
